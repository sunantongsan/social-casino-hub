name: Publish game web patch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: internal-web-patch
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VITE_INTERNAL_TEST: 'true'
      VITE_INTERNAL_ENDPOINT: https://uzinxxeadejmzxqmqqtx.supabase.co/functions/v1/social-casino-internal
      VITE_DEV_AUTH: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package and publish compatible web content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/client/dist
          zip -qr ../../../web.zip .
          cd ../../..
          python3 infra/publish-patch.py
